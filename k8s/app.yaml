apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: task-tracker
  template:
    metadata:
      labels:
        app: task-tracker
    spec:
      containers:
        - name: app
          image: ghcr.io/depaul-teaching/student-task-tracker:sha-2b7667a4ea5618a8f6f0e59ae4a03127775ab9aa
          ports:
            - containerPort: 8000
          env:
            - name: APP_TITLE
              value: "Task Flow - Student Task Tracker"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: app
spec:
  selector:
    app: task-tracker
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
